name: ARIVE
description: ARIVE (getarive.com) was an urban quick-commerce platform founded in Paris during
  the COVID-19 pandemic that delivered fashion, beauty, and lifestyle products to customers within
  hours. Operating across Berlin, Munich, Hamburg, Düsseldorf, Frankfurt, and Paris, it connected
  more than 500 brands and 200 local stores directly to young, convenience-focused urban shoppers.
  Backed by Balderton Capital, LaFamiglia, and Triple Point Capital with roughly €31.7M raised, the
  company ceased operations in mid-2023 following a sale of the business. No public API, developer
  portal, SDK, or other technical surface was ever published; this profile is retained for network
  and portfolio-graph completeness.
